[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpiod-stepper-motors"
version = "0.1.0"
description = "A simple library for controlling stepper motor drivers with Raspberry Pi GPIO."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "gpiod>=2.0.2,<3",
    "loguru>=0.7.3",
    "pydantic>=2.14.2",
    "python-periphery>=2.5.0",
    "pyyaml>=6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "matplotlib>=3.10.0",
    "mypy>=2.4.1",
    "pdoc>=16.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
