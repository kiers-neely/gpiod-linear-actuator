[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpiod-stepper-motors"
version = "0.1.0"
description = "A simple library for controlling stepper motor drivers with Raspberry Pi GPIO."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["gpiod>=2.0.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
